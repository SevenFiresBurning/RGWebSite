    <section class="mailing-signup" aria-labelledby="mailing-heading">
      <div>
        <h2 id="mailing-heading">Stay in the loop</h2>
        <p>Music, new projects and updates from R&amp;G.</p>
        <p>
          Your email is used for Resistance &amp; Ground updates. To leave the
          list,
          <a href="mailto:resistanceandground@gmail.com?subject=Unsubscribe"
            >request removal</a
          >.
        </p>
      </div>
      <form
        name="rg-mailing-list"
        method="POST"
        action="https://formspree.io/f/mljdnpzl"
      >
        <input type="hidden" name="subject" value="New Resistance &amp; Ground mailing-list signup" />
        <label for="mailing-email">Email address</label
        ><input
          id="mailing-email"
          name="email"
          type="email"
          autocomplete="email"
          required
          maxlength="254"
        /><label class="mailing-consent"
          ><input
            type="checkbox"
            name="consent"
            value="Yes, send me email updates"
            required
          /><span
            >Send me email updates from Resistance &amp; Ground.</span
          ></label
        ><button type="submit">Join the mailing list</button>
        <p role="status" aria-live="polite" aria-atomic="true"></p>
      </form>
    </section>
    <footer>
      <a class="footer-name" href="../../index.html">Resistance & Ground</a
      ><span>Music &amp; Media. Publishing. Web &amp; Systems.</span
